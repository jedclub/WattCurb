<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#121720" />
    </linearGradient>
    <linearGradient id="barBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="barPgoIpc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="barPgoCycles" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="barPgoCache" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="barPgoLatency" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="920" height="420" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#00f0ff">⚡ WattCurb: Hardware PMU &amp; Profile-Guided Optimization (PGO) Audit</text>
  <text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" fill="#94a3b8">Empirical A/B Benchmark on AMD Zen 2 (Ryzen 7 PRO 4750U) | Linux 6.x | GCC 16 C++23</text>
  <line x1="32" y1="84" x2="888" y2="84" stroke="#1e293b" stroke-width="1.5" />

  <!-- Legend -->
  <rect x="620" y="32" width="14" height="14" rx="3" fill="#64748b" />
  <text x="642" y="44" font-family="monospace" font-size="12" fill="#94a3b8">Baseline (-O3 + LTO)</text>
  <rect x="760" y="32" width="14" height="14" rx="3" fill="#00f0ff" />
  <text x="782" y="44" font-family="monospace" font-size="12" font-weight="bold" fill="#00f0ff">PGO (-fprofile-use)</text>

  <!-- Metric 1: IPC (Higher is better) -->
  <text x="32" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="bold" fill="#e2e8f0">Instructions Per Cycle (IPC)</text>
  <text x="460" y="122" font-family="monospace" font-size="13" font-weight="bold" fill="#00f0ff">+20.0% Throughput</text>
  
  <rect x="32" y="132" width="300" height="20" rx="4" fill="url(#barBase)" opacity="0.75" />
  <text x="340" y="147" font-family="monospace" font-size="12" fill="#cbd5e1">1.00 IPC</text>
  
  <rect x="32" y="156" width="360" height="20" rx="4" fill="url(#barPgoIpc)" filter="url(#glow)" />
  <text x="400" y="171" font-family="monospace" font-size="12" font-weight="bold" fill="#00f0ff">1.20 IPC</text>

  <!-- Metric 2: Active CPU Cycles (Lower is better) -->
  <text x="32" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="bold" fill="#e2e8f0">CPU Cycles to Complete Workload</text>
  <text x="460" y="206" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">-17.6% Cycles Saved</text>
  
  <rect x="32" y="216" width="450" height="20" rx="4" fill="url(#barBase)" opacity="0.75" />
  <text x="490" y="231" font-family="monospace" font-size="12" fill="#cbd5e1">7.37M Cycles</text>
  
  <rect x="32" y="240" width="371" height="20" rx="4" fill="url(#barPgoCycles)" />
  <text x="410" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981">6.07M Cycles</text>

  <!-- Metric 3: L1-dcache Load Misses (Lower is better) -->
  <text x="32" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="bold" fill="#e2e8f0">L1 Data Cache Misses</text>
  <text x="460" y="290" font-family="monospace" font-size="13" font-weight="bold" fill="#a855f7">-24.5% Miss Reduction</text>
  
  <rect x="32" y="300" width="410" height="20" rx="4" fill="url(#barBase)" opacity="0.75" />
  <text x="450" y="315" font-family="monospace" font-size="12" fill="#cbd5e1">68.2K Misses</text>
  
  <rect x="32" y="324" width="310" height="20" rx="4" fill="url(#barPgoCache)" />
  <text x="350" y="339" font-family="monospace" font-size="12" font-weight="bold" fill="#a855f7">51.5K Misses</text>

  <!-- Metric 4: ToolTip Render Latency (Lower is better) -->
  <text x="32" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14" font-weight="bold" fill="#e2e8f0">ToolTip Render Latency</text>
  <text x="460" y="374" font-family="monospace" font-size="13" font-weight="bold" fill="#f59e0b">1.90x Speedup (27.4 ns)</text>
  
  <rect x="32" y="384" width="380" height="18" rx="4" fill="url(#barBase)" opacity="0.75" />
  <text x="420" y="398" font-family="monospace" font-size="12" fill="#cbd5e1">52.1 ns</text>
  
  <rect x="32" y="404" width="200" height="10" rx="3" fill="url(#barPgoLatency)" />
  <text x="240" y="413" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b">27.4 ns</text>

  <!-- Side Badge Box: Zero-Cost Architectural Guarantees -->
  <g transform="translate(615, 95)">
    <rect width="273" height="295" rx="8" fill="#151b26" stroke="#2a3649" stroke-width="1.5" />
    <text x="16" y="32" font-family="monospace" font-size="13" font-weight="bold" fill="#00f0ff">⚡ ZERO-COST ARCHITECTURE</text>
    <line x1="16" y1="44" x2="257" y2="44" stroke="#2a3649" stroke-width="1" />

    <text x="16" y="72" font-family="monospace" font-size="12" fill="#94a3b8">Active CPU Usage:</text>
    <text x="16" y="90" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">&lt; 0.05% CPU (Idle)</text>

    <text x="16" y="122" font-family="monospace" font-size="12" fill="#94a3b8">Resident Memory (RSS):</text>
    <text x="16" y="140" font-family="monospace" font-size="14" font-weight="bold" fill="#00f0ff">&lt; 8 MB (Zero Heap Leaks)</text>

    <text x="16" y="172" font-family="monospace" font-size="12" fill="#94a3b8">Kernel Polling Wakeups:</text>
    <text x="16" y="190" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">0 wakeups/sec (Pure epoll)</text>

    <text x="16" y="222" font-family="monospace" font-size="12" fill="#94a3b8">L10n Lookup Latency:</text>
    <text x="16" y="240" font-family="monospace" font-size="14" font-weight="bold" fill="#a855f7">7.2 ns (13 Languages)</text>

    <rect x="16" y="256" width="241" height="26" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1" />
    <text x="24" y="273" font-family="monospace" font-size="11" font-weight="bold" fill="#00f0ff">★ SUB-MILLIWATT OVERHEAD</text>
  </g>
</svg>
